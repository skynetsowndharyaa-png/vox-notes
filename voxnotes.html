<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoxNotes</title>
<style>
:root{color-scheme:dark;--fg:#e6e8f0;--mut:rgba(255,255,255,.55);--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:linear-gradient(135deg,#7c5cff,#4f8cff);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--fg);font:15px system-ui,sans-serif;background:radial-gradient(900px 500px at 10% -10%,rgba(92,70,200,.35),transparent),#0b0d14}
#app{max-width:1080px;margin:auto;padding:16px}
.logo{font-size:22px;font-weight:700;background:var(--acc);-webkit-background-clip:text;background-clip:text;color:transparent}.tag{font-size:12px;color:var(--mut);margin-bottom:18px}
.glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:16px;padding:14px}
.btn{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;padding:8px 14px;background:rgba(255,255,255,.1)}.btn:hover{background:rgba(255,255,255,.18)}
.btn.p{background:var(--acc)}.btn.d{background:rgba(220,38,38,.4)}.btn:disabled{opacity:.5;cursor:default}
input,textarea{font:inherit;color:inherit;width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
:focus-visible{outline:2px solid #8fb0ff;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats b{font-size:28px;display:block}.stats span,.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;list-style:none;padding:0;margin:0}
.card{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}.card:hover{background:rgba(255,255,255,.1)}
.card h3{margin:4px 0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{margin:0;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kind{font-size:12px;color:#b9a8ff}.err{color:#fca5a5;font-size:13px}.warn{color:#fcd34d;font-size:13px}
.edit{display:grid;grid-template-columns:1fr 360px;gap:14px}.col{display:flex;flex-direction:column;gap:10px}
.msgs{max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px}.ai{white-space:pre-wrap;font-size:14px}.me{text-align:right;color:#cdbfff;font-size:14px}
.time{font:700 36px ui-monospace,monospace;text-align:center}.tabs{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.tabs .btn[aria-selected=true]{background:var(--acc)}
audio{width:100%}
@media(max-width:820px){.edit{grid-template-columns:1fr}#app{padding:12px}}
</style></head>
<body><div id="app"></div>
<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');

/* ---------- storage (IndexedDB: notes + audio blobs) ---------- */
const dbReady = new Promise((res, rej) => {
  const r = indexedDB.open('voxnotes', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('notes', { keyPath: 'id' });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function tx(mode, fn) {
  const db = await dbReady;
  return new Promise((res, rej) => {
    const t = db.transaction('notes', mode), rq = fn(t.objectStore('notes'));
    t.oncomplete = () => res(rq.result); t.onerror = () => rej(t.error);
  });
}
const Store = { all: () => tx('readonly', s => s.getAll()), put: n => tx('readwrite', s => s.put(n)), del: id => tx('readwrite', s => s.delete(id)) };

/* ---------- VoxAI service ----------
   In Claude preview it uses the viewer-granted `sample` capability.
   When self-hosted it calls YOUR backend (AI_ENDPOINT) so the API key stays on the server. */
const AI_ENDPOINT = '/api/ai';
const SYSTEM = 'You are VoxAI, an assistant inside a notes app. Work ONLY from the note provided. If the answer is not in the note, say so. Be concise. Use plain text and "- " bullets.';
const TASKS = {
  summarize: 'Write a short, clear summary of the note.',
  keypoints: 'Extract the key points as bullet points.',
  actions: "List action items/tasks found in the note as bullets. If none, say 'No action items found.'",
  title: 'Suggest one short title (max 8 words). Reply with the title only.',
  improve: 'Rewrite the note to be clearer, better organized and grammatically correct. Keep the meaning. Reply with the rewritten note only.'
};
let sampleFn = null;
(async () => { try { sampleFn = await window.claude?.use('sample'); } catch {} })();

async function askAI(task, note, question) {
  const instr = task === 'ask' ? 'Question about the note: ' + question : TASKS[task];
  if (sampleFn) {
    try { return (await sampleFn(SYSTEM + '\n\n<note>\n' + note.slice(0, 20000) + '\n</note>\n\n' + instr, { cache: false, modelTier: 'quick' })).text; }
    catch (e) {
      if (e?.code === 'not_granted') throw new Error('AI permission was declined, so VoxAI cannot run.');
      if (e?.code === 'rate_limited') throw new Error('Too many AI requests. Please wait a moment.');
      throw new Error('VoxAI failed. Please try again.');
    }
  }
  let res;
  try { res = await fetch(AI_ENDPOINT, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ task, note, question }) }); }
  catch { throw new Error('No AI backend is reachable. Run the VoxNotes server or open this page in Claude.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'VoxAI is not available right now.');
  return data.text;
}

/* ---------- app state ---------- */
let notes = [], filter = 'all', query = '';
const FILTERS = [['all','All Notes'],['text','Text Notes'],['voice','Voice Notes'],['ai','AI Processed']];
const blank = kind => ({ id: crypto.randomUUID(), kind, title: '', content: '', aiProcessed: false, createdAt: Date.now(), updatedAt: Date.now() });

async function load() {
  try { notes = (await Store.all()).sort((a, b) => b.updatedAt - a.updatedAt); home(); }
  catch { $('#app').innerHTML = shell('<p class="err" role="alert">Could not open browser storage (private mode or blocked). Notes cannot be saved.</p>'); }
}
const shell = inner => `<div class="logo">VoxNotes</div><div class="tag">Your Voice. Your Notes. Your AI.</div>${inner}`;

/* ---------- dashboard ---------- */
function home() {
  const count = k => notes.filter(n => n.kind === k).length;
  $('#app').innerHTML = shell(`
    <h1 style="margin:0;font-size:24px">Welcome back 👋</h1>
    <div class="stats"><div class="glass"><b>${notes.length}</b><span>Total notes</span></div><div class="glass"><b>${count('text')}</b><span>Text notes</span></div><div class="glass"><b>${count('voice')}</b><span>Voice notes</span></div></div>
    <div class="row"><button class="btn p" id="nt">＋ Create Text Note</button><button class="btn p" id="nv">🎙 Record Voice Note</button><span class="mut">✨ Open any note to use VoxAI</span></div>
    <div style="margin-top:14px"><input id="q" type="search" aria-label="Search notes" placeholder="Search titles, text and transcripts..." value="${esc(query)}"></div>
    <div class="tabs" role="tablist">${FILTERS.map(([f, l]) => `<button class="btn" role="tab" aria-selected="${filter === f}" data-f="${f}">${l}</button>`).join('')}</div>
    <div id="list"></div>`);
  $('#nt').onclick = () => editor(blank('text'), true);
  $('#nv').onclick = () => editor(blank('voice'), true);
  $('#q').oninput = e => { query = e.target.value; list(); };
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; home(); });
  list();
}
function list() {
  const q = query.trim().toLowerCase();
  const shown = notes.filter(n => (filter === 'all' || (filter === 'ai' ? n.aiProcessed : n.kind === filter)) && (!q || n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)));
  $('#list').innerHTML = shown.length ? `<ul class="grid">${shown.map(n => `<li><button class="glass card" data-id="${n.id}">
      <div class="kind">${n.kind === 'voice' ? '🎙 Voice · ' + fmt(n.durationSec || 0) : '📝 Text'}${n.aiProcessed ? ' · ✨ AI' : ''}</div>
      <h3>${esc(n.title)}</h3><p>${esc(n.content || 'No transcript')}</p><div class="mut" style="margin-top:6px;font-size:12px">${new Date(n.updatedAt).toLocaleDateString()}</div></button></li>`).join('')}</ul>`
    : `<div class="glass mut" style="text-align:center;padding:36px">${notes.length ? 'No notes match your search.' : 'No notes yet. Create a text note or record your first voice note.'}</div>`;
  document.querySelectorAll('.card').forEach(c => c.onclick = () => editor(notes.find(n => n.id === c.dataset.id), false));
}

/* ---------- editor ---------- */
function editor(src, isNew) {
  const cur = { ...src };
  $('#app').innerHTML = shell(`<div class="edit"><section class="col">
    <div class="row"><button class="btn" id="back">← Back</button><button class="btn p" id="save">💾 Save</button><span id="delbox">${isNew ? '' : '<button class="btn d" id="del">🗑 Delete</button>'}</span></div>
    <div id="msg" role="alert" class="warn"></div>
    <input id="title" aria-label="Note title" placeholder="Title" value="${esc(cur.title)}">
    <div id="rec"></div><div id="media"></div>
    <textarea id="body" rows="14" aria-label="Note content" placeholder="${cur.kind === 'voice' ? 'Transcript appears here. Edit it, or type one.' : 'Start writing...'}">${esc(cur.content)}</textarea>
    <div class="mut" style="font-size:12px">${isNew ? '' : 'Created ' + new Date(cur.createdAt).toLocaleString() + ' · Modified ' + new Date(cur.updatedAt).toLocaleString()}</div></section>
    <aside class="glass col" style="align-self:start"><b>✨ VoxAI</b><span class="mut">How can I help with this note?</span>
      <div class="row">${[['summarize','Summarize'],['keypoints','Key Points'],['actions','Action Items'],['title','Generate Title'],['improve','Improve Note']].map(([t, l]) => `<button class="btn" data-ai="${t}">${l}</button>`).join('')}</div>
      <div class="msgs" id="msgs" aria-live="polite"></div><div id="aierr" class="err" role="alert"></div>
      <div class="row" style="flex-wrap:nowrap"><input id="ask" aria-label="Ask about this note" placeholder="Ask something about this note..."><button class="btn p" id="askbtn">Ask</button></div>
      <span class="mut" style="font-size:12px">AI-generated information may sometimes be inaccurate.</span></aside></div>`);
  const title = $('#title'), body = $('#body'), msg = t => $('#msg').textContent = t;
  title.oninput = () => cur.title = title.value; body.oninput = () => cur.content = body.value;
  $('#back').onclick = home;

  $('#save').onclick = async () => {
    if (!cur.title.trim() && !cur.content.trim() && !cur.audio) return msg('Add a title, some content or a recording before saving.');
    try { cur.title = cur.title.trim() || 'Untitled note'; cur.updatedAt = Date.now(); await Store.put(cur); notes = (await Store.all()).sort((a, b) => b.updatedAt - a.updatedAt); home(); }
    catch { msg('Could not save the note. Browser storage may be full or blocked.'); }
  };
  if (!isNew) $('#del').onclick = () => {
    $('#delbox').innerHTML = '<span class="warn">Delete this note? This action cannot be undone.</span> <button class="btn d" id="yes">Yes, delete</button> <button class="btn" id="no">Cancel</button>';
    $('#no').onclick = () => { $('#delbox').innerHTML = '<button class="btn d" id="del2">🗑 Delete</button>'; };
    $('#yes').onclick = async () => { await Store.del(cur.id); notes = notes.filter(n => n.id !== cur.id); home(); };
  };

  /* media area: player for saved audio */
  function drawMedia() {
    const m = $('#media');
    if (!cur.audio) { m.innerHTML = ''; if (cur.kind === 'voice') recorder(); return; }
    const url = URL.createObjectURL(cur.audio);
    m.innerHTML = `<div class="glass col"><audio controls src="${url}"></audio><div class="row" style="justify-content:space-between"><span class="mut">Duration ${fmt(cur.durationSec || 0)}</span><button class="btn d" id="delrec">Delete Recording</button></div></div>`;
    $('#delrec').onclick = () => { cur.audio = undefined; cur.durationSec = undefined; drawMedia(); };
  }

  /* recorder: MediaRecorder + browser SpeechRecognition (live) */
  function recorder() {
    const box = $('#rec'), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let mr, stream, chunks = [], secs = 0, timer, sr, finalText = '', state = 'idle';
    const draw = err => {
      box.innerHTML = `<div class="glass col"><div class="time" aria-live="polite">${fmt(secs)}</div>
        ${err ? `<div class="err" role="alert">${esc(err)}</div>` : ''}
        ${SR ? '' : '<div class="warn">Live speech-to-text is not supported in this browser (use Chrome or Edge). You can type the transcript manually.</div>'}
        <div class="row" style="justify-content:center">
          ${state === 'idle' ? '<button class="btn p" id="r-start">🎙 Start Recording</button>' : ''}
          ${state === 'recording' ? '<button class="btn" id="r-pause">⏸ Pause</button>' : ''}
          ${state === 'paused' ? '<button class="btn" id="r-resume">▶ Resume</button>' : ''}
          ${state !== 'idle' ? '<button class="btn d" id="r-stop">⏹ Stop</button>' : ''}</div>
        <div class="mut" id="live"></div></div>`;
      $('#r-start')?.addEventListener('click', start); $('#r-pause')?.addEventListener('click', pause);
      $('#r-resume')?.addEventListener('click', resume); $('#r-stop')?.addEventListener('click', stop);
    };
    const tick = () => { timer = setInterval(() => { secs++; const t = $('.time'); if (t) t.textContent = fmt(secs); }, 1000); };
    function startSR() {
      if (!SR) return;
      sr = new SR(); sr.continuous = true; sr.interimResults = true; sr.lang = navigator.language || 'en-US';
      sr.onresult = e => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) finalText += t + ' '; else interim += t; }
        const l = $('#live'); if (l) l.textContent = 'Live transcript: ' + (finalText + interim).trim();
      };
      const mine = sr; sr.onend = () => { if (sr === mine && state === 'recording') try { mine.start(); } catch {} };
      sr.onerror = e => { if (e.error !== 'no-speech') { const l = $('#live'); if (l) l.textContent = 'Speech-to-text unavailable (' + e.error + '). Type the transcript manually.'; } };
      try { sr.start(); } catch {}
    }
    const stopSR = () => { const s = sr; sr = null; try { s?.stop(); } catch {} };
    async function start() {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return draw('This browser does not support audio recording.');
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) { return draw(e.name === 'NotAllowedError' || e.name === 'SecurityError'
        ? 'Microphone access was denied or is blocked here. Allow the microphone in your browser site settings (or open the page in its own tab) and try again.'
        : 'No microphone could be accessed.'); }
      chunks = []; secs = 0; finalText = '';
      mr = new MediaRecorder(stream);
      mr.ondataavailable = e => e.data.size && chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        cur.audio = new Blob(chunks, { type: mr.mimeType || 'audio/webm' }); cur.durationSec = secs;
        if (finalText.trim()) { cur.content = finalText.trim(); body.value = cur.content; }
        $('#rec').innerHTML = ''; drawMedia();
      };
      mr.onerror = () => draw('Recording failed. Please try again.');
      mr.start(); state = 'recording'; draw(); tick(); startSR();
    }
    const pause = () => { mr.pause(); clearInterval(timer); stopSR(); state = 'paused'; draw(); };
    const resume = () => { mr.resume(); state = 'recording'; draw(); tick(); startSR(); };
    const stop = () => { clearInterval(timer); stopSR(); state = 'stopped'; mr.stop(); };
    draw();
  }
  drawMedia();

  /* VoxAI panel */
  const msgs = $('#msgs'); let busy = false;
  const add = (cls, text, extra = '') => { const d = document.createElement('div'); d.className = cls === 'ai' ? 'glass ai' : 'me'; d.textContent = text; if (extra) d.append(extra); msgs.append(d); msgs.scrollTop = msgs.scrollHeight; return d; };
  async function run(task, label, q) {
    $('#aierr').textContent = '';
    if (!cur.content.trim()) return $('#aierr').textContent = 'This note is empty. Add some text or a transcript first.';
    if (busy) return; busy = true; add('me', label);
    const wait = add('ai', 'VoxAI is thinking…');
    try {
      const text = await askAI(task, cur.content, q); wait.textContent = text; cur.aiProcessed = true;
      const bar = document.createElement('div'); bar.className = 'row'; bar.style.marginTop = '8px';
      if (task === 'title') bar.innerHTML = '<button class="btn">Use as title</button>';
      if (task === 'improve') bar.innerHTML = '<button class="btn p">Replace original</button><button class="btn">Keep original</button>';
      const [b1, b2] = bar.children;
      if (task === 'title') b1.onclick = () => { cur.title = text.replace(/^"|"$/g, '').trim(); title.value = cur.title; };
      if (task === 'improve') { b1.onclick = () => { cur.content = text; body.value = text; bar.remove(); }; b2.onclick = () => bar.remove(); }
      if (bar.children.length) wait.append(bar);
    } catch (e) { wait.remove(); $('#aierr').textContent = e.message; }
    finally { busy = false; }
  }
  document.querySelectorAll('[data-ai]').forEach(b => b.onclick = () => run(b.dataset.ai, b.textContent));
  const ask = () => { const v = $('#ask').value.trim(); if (v) { $('#ask').value = ''; run('ask', v, v); } };
  $('#askbtn').onclick = ask; $('#ask').onkeydown = e => e.key === 'Enter' && ask();
}
load();
</script></body></html>
